name: build site (pull request)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Pinned rather than required: 3.11, 3.13 and 3.14 were checked to
          # produce byte-identical output from the same requirements.txt.
          python-version: '3.11'

      - name: Install bibtool
        run: |
          sudo apt-get update --fix-missing
          sudo apt-get install -y bibtool

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r community/requirements.txt

      - name: Build
        id: build
        # Secrets are not available to pull requests from forks; build.sh
        # unsets the empty values that produces, so the build degrades (an
        # empty community map) rather than failing.
        run: ./build.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ZULIP_KEY: ${{ secrets.ZULIP_KEY }}
          QUEUEBOARD_REVIEWER_INTERESTS_API_URL: ${{ vars.QUEUEBOARD_REVIEWER_INTERESTS_API_URL }}

      - name: Upload artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site
          path: _site/
